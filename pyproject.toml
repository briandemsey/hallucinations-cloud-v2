[project]
name = "hallucinations-cloud"
version = "0.1.0"
description = "hallucinations.cloud detection service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "supabase>=2.10",
    "openai>=1.59",
    "anthropic>=0.42",
    "google-generativeai>=0.8",
    "cohere>=5.13",
    "requests>=2.32",
    "stripe>=10.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
